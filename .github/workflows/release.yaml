name: Release

# A release is cut whenever VERSION changes on main: the workflow tags the
# commit as v<VERSION> and publishes it. Pushing a v*.*.* tag by hand still
# works, and "Run workflow" re-runs the release for the current VERSION.
on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yaml
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/olekgoli/emby-date-sync

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emby Date Sync
        uses: actions/checkout@v6
        with:
          path: emby-date-sync

      - name: Resolve release tag
        id: release
        working-directory: emby-date-sync
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "${tag}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Releases run from main or a v*.*.* tag, not ${GITHUB_REF_NAME}"
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)"
          if [ -z "${existing}" ]; then
            echo "create_tag=true" >> "${GITHUB_OUTPUT}"
          elif [ "${existing}" != "${GITHUB_SHA}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "::notice::${tag} already exists at ${existing}; nothing to release"
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::${tag} already exists at ${existing}; bump VERSION to release ${GITHUB_SHA}"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test
        if: steps.release.outputs.publish == 'true'
        working-directory: emby-date-sync
        run: |
          python -m compileall app tests
          python -m unittest discover -s tests

      - name: Create release tag
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.create_tag == 'true'
        working-directory: emby-date-sync
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: emby-date-sync
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=emby-date-sync-linux-amd64
          cache-to: type=gha,mode=max,scope=emby-date-sync-linux-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Resolve image digest
        if: steps.release.outputs.publish == 'true'
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${RELEASE_TAG}"
          digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
          echo "ref=${image}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Checkout homelab
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          repository: olekgoli/homelab
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab

      - name: Update homelab image
        if: steps.release.outputs.publish == 'true'
        id: homelab_update
        working-directory: homelab
        env:
          IMAGE_WITH_DIGEST: ${{ steps.image.outputs.ref }}
        run: |
          if [ ! -f workloads/media/emby-date-sync/cronjob.yaml ]; then
            echo "homelab emby-date-sync manifest is not present yet; skipping deploy PR"
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("workloads/media/emby-date-sync/cronjob.yaml")
          image = os.environ["IMAGE_WITH_DIGEST"]
          text = path.read_text(encoding="utf-8")
          old = "image: ghcr.io/olekgoli/emby-date-sync:"
          lines = []
          replaced = False
          for line in text.splitlines():
              if line.strip().startswith(old):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines.append(f"{indent}image: {image}")
                  replaced = True
              else:
                  lines.append(line)
          if not replaced:
              raise SystemExit("emby-date-sync image line not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          echo "updated=true" >> "${GITHUB_OUTPUT}"

      - name: Open homelab deploy PR
        if: steps.release.outputs.publish == 'true' && steps.homelab_update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.HOMELAB_REPO_TOKEN }}
          path: homelab
          branch: deploy/emby-date-sync-${{ steps.release.outputs.tag }}
          commit-message: Deploy Emby Date Sync ${{ steps.release.outputs.tag }}
          title: Deploy Emby Date Sync ${{ steps.release.outputs.tag }}
          body: |
            Updates Emby Date Sync to `${{ steps.image.outputs.ref }}`.

            Source tag: `${{ steps.release.outputs.tag }}`
            Source commit: `${{ github.sha }}`
          labels: deploy,emby-date-sync
